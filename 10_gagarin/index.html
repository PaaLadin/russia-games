<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Гагарин — орбитальный симулятор</title>
<link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/qa.css">
</head>
<body>
<div id="app">
  <header>
    <h1>ГАГАРИН</h1>
    <div id="hud">
      <span>Виток: <b id="orbit">1</b>/3</span>
      <span>Топливо: <b id="fuel">100</b>%</span>
      <span>Связь: <b id="signal">100</b>%</span>
    </div>
  </header>
  <canvas id="view" width="600" height="480"></canvas>
  <div id="controls">
    <button data-act="boost">Ускорить</button>
    <button data-act="brake">Затормозить</button>
    <button data-act="radio">Связь</button>
    <button data-act="return">Возврат</button>
  </div>
  <p id="hint">Держи орбиту. Слишком близко — сгоришь, слишком далеко — улетишь.</p>
  <div id="win" class="hidden">
    <h2 id="end-title">ПОЕХАЛИ!</h2>
    <p id="end-text"></p>
    <button id="btn-again">Ещё раз</button>
  </div>
</div>
<script src="js/game.js"></script>
  <script src="js/qa.js"></script>
</body>
</html>
