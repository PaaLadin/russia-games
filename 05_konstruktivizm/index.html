<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конструктивизм — архитектурный паззл</title>
<link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/qa.css">
</head>
<body>
<div id="app">
  <header>
    <h1>КОНСТРУКТИВИЗМ</h1>
    <div id="hud">
      <span>Здание: <b id="bldg">1</b>/5</span>
      <span>Ходы: <b id="moves">0</b></span>
    </div>
  </header>
  <canvas id="view" width="540" height="540"></canvas>
  <div id="palette"></div>
  <p id="hint">Собери здание по образцу. Выбери блок, затем клетку.</p>
  <div id="win" class="hidden">
    <h2>ГОРОД ПОСТРОЕН</h2>
    <p id="end-text"></p>
    <button id="btn-again">Ещё раз</button>
  </div>
</div>
<script src="js/game.js"></script>
  <script src="js/qa.js"></script>
</body>
</html>
