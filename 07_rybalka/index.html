<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Зимняя рыбалка — лёд, лунка, терпение</title>
<link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/qa.css">
</head>
<body>
<div id="app">
  <header>
    <h1>ЗИМНЯЯ РЫБАЛКА</h1>
    <div id="hud">
      <span>Улов: <b id="catch">0</b></span>
      <span>Время: <b id="time">60</b>с</span>
      <span>Холод: <b id="cold">0</b>%</span>
    </div>
  </header>
  <canvas id="view" width="560" height="420"></canvas>
  <div id="controls">
    <button id="btn-drop">Опустить</button>
    <button id="btn-pull">Подсечь</button>
    <button id="btn-warm">Погреться</button>
  </div>
  <p id="hint">Жди поклёвки, не дёргай раньше времени. Холод растёт — грелка рядом.</p>
  <div id="win" class="hidden">
    <h2 id="end-title">РЫБАЛКА УДАЛАСЬ</h2>
    <p id="end-text"></p>
    <button id="btn-again">Ещё раз</button>
  </div>
</div>
<script src="js/game.js"></script>
  <script src="js/qa.js"></script>
</body>
</html>
