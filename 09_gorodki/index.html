<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Городки — народная игра</title>
<link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/qa.css">
</head>
<body>
<div id="app">
  <header>
    <h1>ГОРОДКИ</h1>
    <div id="hud">
      <span>Фигура: <b id="fig">1</b>/3</span>
      <span>Броски: <b id="throws">0</b></span>
      <span>Очки: <b id="score">0</b></span>
    </div>
  </header>
  <canvas id="view" width="640" height="420"></canvas>
  <div id="controls">
    <div class="slider">
      <label>Сила</label>
      <input type="range" id="power" min="20" max="100" value="60">
      <span id="power-val">60</span>
    </div>
    <div class="slider">
      <label>Угол</label>
      <input type="range" id="angle" min="-30" max="30" value="0">
      <span id="angle-val">0</span>
    </div>
    <button id="btn-throw">БРОСОК</button>
  </div>
  <p id="hint">Сбей все фигуры. Каждый бросок — очко, сбитая фигура — пять.</p>
  <div id="win" class="hidden">
    <h2 id="end-title">ГОРОД ВЗЯТ</h2>
    <p id="end-text"></p>
    <button id="btn-again">Ещё раз</button>
  </div>
</div>
<script src="js/game.js"></script>
  <script src="js/qa.js"></script>
</body>
</html>
