<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лукоморье — сказочный рогалик</title>
<link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/qa.css">
</head>
<body>
<div id="app">
  <header>
    <h1>ЛУКОМОРЬЕ</h1>
    <div id="hud">
      <span>Сердце: <b id="hp">100</b></span>
      <span>Меч: <b id="sword">1</b></span>
      <span>Глубина: <b id="depth">1</b></span>
      <span>Золото: <b id="gold">0</b></span>
    </div>
  </header>
  <canvas id="view" width="560" height="560"></canvas>
  <p id="hint">WASD — шаг, F — удар по врагу, E — подобрать. Дойди до избушки.</p>
  <div id="log"></div>
  <div id="win" class="hidden">
    <h2 id="end-title">ИЗБУШКА НАЙДЕНА</h2>
    <p id="end-text"></p>
    <button id="btn-again">Новый забег</button>
  </div>
</div>
<script src="js/game.js"></script>
  <script src="js/qa.js"></script>
</body>
</html>
