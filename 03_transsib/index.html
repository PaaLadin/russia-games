<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Транссиб — менеджмент поезда</title>
<link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/qa.css">
</head>
<body>
<div id="app">
  <header>
    <h1>ТРАНССИБ</h1>
    <div id="hud">
      <span>Станция: <b id="station">0</b>/10</span>
      <span>Топливо: <b id="coal">100</b>%</span>
      <span>Вода: <b id="water">100</b>%</span>
      <span>Пассажиры: <b id="passengers">0</b></span>
    </div>
  </header>
  <canvas id="view" width="620" height="360"></canvas>
  <div id="log"></div>
  <div id="controls">
    <button id="btn-go">Вперёд</button>
    <button id="btn-coal">Уголь</button>
    <button id="btn-water">Вода</button>
    <button id="btn-rest">Привал</button>
  </div>
  <div id="win" class="hidden">
    <h2 id="end-title">МОСКВА!</h2>
    <p id="end-text"></p>
    <button id="btn-again">Ещё раз</button>
  </div>
</div>
<script src="js/game.js"></script>
  <script src="js/qa.js"></script>
</body>
</html>
